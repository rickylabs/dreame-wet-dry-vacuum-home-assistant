[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# pytest-homeassistant-custom-component runs the tests inside a real
# Home Assistant core. Every test is async-capable and has a hard deadline,
# so a hang fails instead of stalling the run.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Keep the reverse-engineered API constants file readable as data tables
"custom_components/dreame_wet_dry_vacuum/const.py" = ["E501"]
